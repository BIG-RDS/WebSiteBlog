<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="style.css" />

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-lockup">
        <a class="site-logo" href="index.html">All About <span>the World</span></a>
        <a class="site-domain" href="https://big-rds.github.io/WebSiteBlog/">big-rds.github.io</a>
      </div>
      <nav class="site-nav" id="mainNav">
        <ul>
          <li><a href="index.html" class="active">홈</a></li>

  <section class="hero">

      <h1>세상의 모든 정보, 한 곳에서</h1>

        <input type="text" id="homeSearch" placeholder="종목명, 여행지, 태그로 검색해보세요" />
        <button type="submit">검색</button>

    </div>

    <section class="section">
      <div class="section-header">
        <h2>🔥 최신 글</h2>
      </div>
      <div class="filter-bar" id="homeFilterBar">
        <button data-filter="all" class="active">전체</button>
        <button data-filter="stock">주식(종목분석)</button>
        <button data-filter="travel">여행</button>
      </div>
      <div class="card-grid" id="homeCardGrid">
        <p class="empty-state">불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <h3>All About the World</h3>
        <p>세상의 모든 정보를 큐레이션합니다.</p>
        <div class="social-links">
          <a href="mailto:ikgyubae@gmail.com">Email</a>
          <span class="social-placeholder" aria-disabled="true">Twitter</span>
          <span class="social-placeholder" aria-disabled="true">Instagram</span>

    </div>
    <div class="footer-bottom">&copy; 2026 All About the World. All rights reserved.</div>

  <script src="script.js"></script>
  <script>
    setupSearchAndFilter({
      searchInputId: "homeSearch",
      filterBarId: "homeFilterBar",
      cardGridId: "homeCardGrid",
      getAllPosts: fetchAllPosts,
    });
  </script>
