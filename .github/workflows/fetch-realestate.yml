name: Fetch real estate data

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-realestate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch district JSON files
        env:
          REALESTATE_API_KEY: ${{ secrets.REALESTATE_API_KEY }}
        run: python scripts/fetch_realestate.py

      - name: Commit and push updated data
        run: |
          if [[ -z "$(git status --porcelain .github/data)" ]]; then
            echo "No real estate data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data
          git commit -m "Update real estate data"
          git push
