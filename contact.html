<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 | All About the World</title>
  <meta name="description" content="All About the World에 문의하기." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-lockup">
        <a class="site-logo" href="index.html">All About <span>the World</span></a>
        <a class="site-domain" href="https://big-rds.github.io/WebSiteBlog/">big-rds.github.io</a>
      </div>
      <nav class="site-nav" id="mainNav">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="stock/index.html">주식(종목분석)</a></li>
          <li><a href="travel/index.html">여행</a></li>
          <li><a href="contact.html" class="active">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>문의하기</h1>
      <p>궁금한 점이나 제안하고 싶은 내용을 자유롭게 남겨주세요.</p>
    </div>
  </section>

  <main class="container">
    <section class="section">
      <div class="contact-wrap">
        <form id="contactForm" action="https://formsubmit.co/ikgyubae@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="[All About the World 문의]" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_next" value="https://big-rds.github.io/WebSiteBlog/contact.html?sent=1" />
          <input type="text" name="_honey" class="form-honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required />
          </div>
          <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="message">메시지</label>
            <textarea id="message" name="message" placeholder="문의 내용을 입력해주세요." required></textarea>
          </div>
          <button type="submit" class="btn-submit">메시지 보내기</button>
        </form>
        <p class="form-note">메시지는 안전한 FormSubmit 서비스를 통해 이메일로 전달됩니다.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <h3>All About the World</h3>
        <p>세상의 모든 정보를 큐레이션합니다.</p>
        <div class="social-links">
          <a href="mailto:ikgyubae@gmail.com">Email</a>
        </div>
      </div>
      <div class="footer-links">
        <ul>
          <li><a href="stock/index.html">주식(종목분석)</a></li>
          <li><a href="travel/index.html">여행</a></li>
          <li><a href="contact.html">문의하기</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">&copy; 2026 All About the World. All rights reserved.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
